
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RONAN AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d1d;color:white;
 font-family:Arial,sans-serif;
 min-height:100vh;display:flex;
 align-items:center;justify-content:center;
 padding:20px
}
main{
 width:100%;max-width:650px;
 background:#111b32;border:1px solid #293b60;
 border-radius:20px;padding:25px;
 box-shadow:0 0 45px #347eff22
}
.logo{text-align:center;margin-bottom:25px}
.logo h1{font-size:35px;margin:0;
 background:linear-gradient(90deg,#55d8f5,#9470ff);
 color:transparent;background-clip:text}
.logo p{font-size:11px;letter-spacing:3px;color:#aab8d3}
h2{font-size:20px}
#chat{
 height:300px;overflow-y:auto;
 background:#080f20;border-radius:12px;
 padding:15px;margin-bottom:15px
}
.msg{padding:12px;margin:8px 0;
 border-radius:12px;font-size:14px;
 line-height:1.5;white-space:pre-wrap}
.ai{background:#192947}
.user{background:#365fb1;margin-left:35px}
form{display:flex;gap:8px}
input{
 flex:1;min-width:0;padding:14px;
 border:1px solid #35496e;border-radius:10px;
 background:#080f20;color:white
}
button{
 padding:13px 18px;border:0;border-radius:10px;
 background:linear-gradient(90deg,#347ef5,#805eff);
 color:white;font-weight:bold;cursor:pointer
}
small{display:block;color:#8998b5;margin-top:15px;line-height:1.5}
</style>
</head>
<body>
<main>
 <div class="logo">
  <h1>✦ RONAN AI</h1>
  <p>TECNOLOGIA A SERVIÇO DAS PESSOAS</p>
 </div>
 <h2>Como posso ajudar você?</h2>
 <div id="chat">
  <div class="msg ai">
   Olá! Eu sou a RONAN AI. Estou aqui para ajudar você a aprender, criar e desenvolver novas ideias.
  </div>
 </div>
 <form id="form">
  <input id="pergunta" placeholder="Digite sua mensagem..." required>
  <button>Enviar</button>
 </form>
 <small>Versão inicial demonstrativa. Ainda não conectada a um modelo real de inteligência artificial.</small>
</main>
<script>
const form=document.getElementById("form");
const chat=document.getElementById("chat");
const pergunta=document.getElementById("pergunta");

form.addEventListener("submit",function(e){
 e.preventDefault();
 const texto=pergunta.value.trim();
 if(!texto)return;

 const usuario=document.createElement("div");
 usuario.className="msg user";
 usuario.textContent=texto;
 chat.appendChild(usuario);
 pergunta.value="";

 const resposta=document.createElement("div");
 resposta.className="msg ai";
 resposta.textContent=
 "Recebi sua mensagem! Esta é a primeira demonstração da RONAN AI. Em breve, poderemos conectar um modelo de IA real para responder suas perguntas.";
 chat.appendChild(resposta);
 chat.scrollTop=chat.scrollHeight;
});
</script>
</body>
</html>
